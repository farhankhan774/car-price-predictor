
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Price Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #334155, transparent 40%),
                linear-gradient(135deg, #0f172a, #1e293b);
            padding: 40px 15px;
            color: white;
        }

        .main-container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
        }

        .header p {
            color: #cbd5e1;
            margin-top: 10px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .form-label {
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 10px;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 13px 15px;
            color: #1e293b;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .predict-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 700;
            transition: 0.3s;
        }

        .predict-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.35);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .result-box h5 {
            color: #cbd5e1;
            font-size: 14px;
        }

        .price {
            font-size: 35px;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 10px;
        }

        .error {
            color: #fca5a5;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }

        @media(max-width: 600px) {
            .header h1 {
                font-size: 26px;
            }

            .glass-card {
                padding: 22px;
            }

            .price {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="main-container">

    <div class="header">
        <h1>🚘 Car Price Predictor</h1>
        <p>AI-powered used car price estimation system</p>
    </div>

    <div class="glass-card">

        <form id="carForm" method="POST" action="/predict">

            <!-- Company -->
            <div class="form-group">
                <label class="form-label">Select Company</label>

                <select class="form-select" id="company" name="company" required
                        onchange="loadCarModels()">

                    {% for company in companies %}
                    {% if company != 'Select Company' %}
                    <option value="{{ company }}">{{ company }}</option>
                    {% endif %}
                    {% endfor %}

                </select>
            </div>

            <!-- Model -->
            <div class="form-group">
                <label class="form-label">Select Car Model</label>

                <select class="form-select" id="car_models" name="car_models" required>
                    <option value="">Select Model</option>
                </select>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label class="form-label">Year of Purchase</label>

                <select class="form-select" id="year" name="year" required>

                    {% for year in years %}
                    <option value="{{ year }}">{{ year }}</option>
                    {% endfor %}

                </select>
            </div>

            <!-- Fuel -->
            <div class="form-group">
                <label class="form-label">Fuel Type</label>

                <select class="form-select" id="fuel_type" name="fuel_type" required>

                    {% for fuel in fuel_types %}
                    <option value="{{ fuel }}">{{ fuel }}</option>
                    {% endfor %}

                </select>
            </div>

            <!-- Kilometres -->
            <div class="form-group">
                <label class="form-label">Kilometres Driven</label>

                <input
                    type="number"
                    class="form-control"
                    id="kilo_driven"
                    name="kilo_driven"
                    placeholder="Example: 45000"
                    min="0"
                    max="1000000"
                    required
                >
            </div>

            <!-- Button -->
            <button type="submit" class="predict-btn" id="predictBtn">
                Predict Car Price →
            </button>

        </form>

        <!-- Loading -->
        <div id="loading" class="text-center mt-4" style="display:none;">
            <div class="spinner-border text-info"></div>
            <p class="mt-2 text-light">AI is calculating your car price...</p>
        </div>

        <!-- Result -->
        <div class="result-box" id="resultBox">
            <h5>Estimated Car Price</h5>
            <div class="price" id="price"></div>
            <p class="text-secondary mt-2 mb-0">
                Estimated value based on the trained ML model
            </p>
        </div>

        <!-- Error -->
        <div class="error" id="error"></div>

    </div>

    <div class="footer">
        Car Price Predictor | Machine Learning Project
    </div>

</div>


<script>

    // Car model data generated from Flask dataset
    const carModels = [
        {% for model in car_models %}
        {
            name: {{ model | tojson }},
            company: {{ car[car['name'] == model]['company'].iloc[0] | tojson }}
        },
        {% endfor %}
    ];

    // Load models according to company
    function loadCarModels() {

        const company = document.getElementById("company").value;
        const modelSelect = document.getElementById("car_models");

        modelSelect.innerHTML = "";

        const filteredModels = carModels.filter(
            car => car.company === company
        );

        filteredModels.forEach(car => {

            const option = document.createElement("option");

            option.value = car.name;
            option.textContent = car.name;

            modelSelect.appendChild(option);

        });

    }

    // Load initial models
    window.addEventListener("DOMContentLoaded", function() {
        loadCarModels();
    });


    // Form submission
    document.getElementById("carForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const form = this;

        const button = document.getElementById("predictBtn");
        const loading = document.getElementById("loading");
        const resultBox = document.getElementById("resultBox");
        const error = document.getElementById("error");
        const price = document.getElementById("price");

        // Reset previous output
        error.textContent = "";
        resultBox.style.display = "none";

        // Loading state
        loading.style.display = "block";
        button.disabled = true;
        button.textContent = "Predicting...";

        try {

            const formData = new FormData(form);

            const response = await fetch("/predict", {
                method: "POST",
                body: formData
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result);
            }

            const predictedPrice = Number(result);

            if (!Number.isFinite(predictedPrice) || predictedPrice < 0) {
                throw new Error("Invalid prediction received from server");
            }

            price.textContent = "₹" + predictedPrice.toLocaleString("en-IN");

            resultBox.style.display = "block";

        }

        catch (err) {

            error.textContent = "Error: " + err.message;
            console.error(err);

        }

        finally {

            loading.style.display = "none";
            button.disabled = false;
            button.textContent = "Predict Car Price →";

        }

    });

</script>

</body>
</html>
